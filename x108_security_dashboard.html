<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Home Security</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;padding:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #30343a;padding-bottom:16px}
.home{font-size:14px;letter-spacing:3px;color:#aeb4bc;font-weight:700}
#time{font-size:48px;font-weight:700;line-height:1}
#date{font-size:15px;color:#aeb4bc;margin-top:8px;text-transform:uppercase;letter-spacing:1px}
.status{font-size:12px;color:#aeb4bc;margin-top:5px;text-align:right}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.card{background:#15181d;border:1px solid #292e35;border-radius:18px;padding:20px}
.label{font-size:12px;color:#9ca3ad;letter-spacing:2px;font-weight:700;margin-bottom:10px}
.title{font-size:25px;font-weight:700;margin-bottom:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:72px;border-radius:14px;text-decoration:none;color:white;font-size:19px;font-weight:700;letter-spacing:.5px;border:1px solid #3b414a;background:#20242a}
.btn.security{border-color:#6f2424;background:#351718}
.btn.camera{border-color:#38414b;background:#1d2329}
.smallrow{display:flex;gap:12px}
.small{min-height:58px;font-size:15px;flex:1}
.footer{text-align:center;color:#6f7781;font-size:11px;padding-top:6px}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="home">HOME</div>
    <div id="date">—</div>
  </div>
  <div>
    <div id="time">--:--</div>
    <div class="status">SECURITY PANEL</div>
  </div>
</div>

<div class="content">
  <div class="card">
    <div class="label">SECURITY</div>
    <div class="title">Cove Security</div>
    <a class="btn security" href="intent:#Intent;package=com.covesmart.android;end">OPEN COVE</a>
  </div>

  <div class="card">
    <div class="label">VIDEO</div>
    <div class="title">LTS Cameras</div>
    <a class="btn camera" href="intent:#Intent;package=com.ltsprovs.mobile.phone;end">ALL CAMERAS</a>
  </div>

  <div class="smallrow">
    <a class="btn small" href="intent:#Intent;action=android.settings.SETTINGS;end">ANDROID SETTINGS</a>
    <a class="btn small" href="javascript:location.reload()">REFRESH</a>
  </div>
</div>

<div class="footer">X108 • LOCAL SECURITY DASHBOARD</div>

<script>
function tick(){
 const d=new Date();
 document.getElementById('time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
